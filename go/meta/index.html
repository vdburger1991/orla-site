<!-- Best-effort auto-forward #1 (JS off). Deliberately NOT content="0":
     the button below must paint and stay tappable first. Inside Meta's
     in-app browser an ungestured navigation may silently no-op — see
     20-business/marketing/2026-09-05-meta-traffic-v4.md §7 and
     REVIEW-scotty-redirect.md §1. The tap is the path; this is a bonus. -->

<style>
:root{
  --canvas:#F5EDE1; --ink:#2E241C; --ink-2:#6E6154;
  --plum:#5B2A47; --plum-pressed:#43203A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--canvas);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:2rem 1.5rem;gap:1.25rem}
.mark{display:flex;align-items:center;gap:.55rem}
.mark svg{width:30px;height:30px;display:block}
.word{font-family:var(--serif);font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
.line{max-width:26ch;font-size:1.05rem;margin:0}
.cta{display:inline-block;background:var(--plum);color:var(--canvas);
  font-size:1.06rem;font-weight:600;text-decoration:none;
  padding:1rem 2rem;border-radius:999px;line-height:1.2;
  box-shadow:0 6px 20px rgba(91,42,71,.22)}
.cta:active{background:var(--plum-pressed)}
.cta:focus-visible{outline:3px solid var(--plum);outline-offset:3px}
.note{font-size:.8rem;color:var(--ink-2);margin:0}
</style>

<p class="line">Log symptoms, cycles and HRT on iPhone, and export one clear PDF.</p>

<a class="cta" href="https://apps.apple.com/app/apple-store/id6797506794?pt=129257514&ct=meta_direct_sep&mt=8">Open in the App Store</a>

<p class="note">Redirecting you to the App Store&hellip;</p>

<script>
/* Mirror the App Store hand-off into PostHog so this redirect page's store
   clicks are comparable with the landing page. pointerdown gives the request
   a head start before iOS hands off; a 1.5s latch keeps one tap to one event.
   A no-op for a visitor who was opted out at init. */
(function () {
  var cta = document.querySelector("a.cta");
  var lastSent = 0;
  function sendTap() {
    var now = Date.now();
    if (now - lastSent < 1500) { return; }
    lastSent = now;
    try { posthog.capture('AppStoreClick', { ct: 'meta_direct_sep' }); } catch (e) {}
  }
  if (cta) {
    cta.addEventListener("pointerdown", sendTap);
    cta.addEventListener("click", sendTap);
  }
})();

/* Best-effort auto-forward #2 — never relied on. Fires after the button has
   painted so she always has a tappable path if this silently no-ops, which is
   what apppa.ge's ungestured redirect did inside the in-app browser. */
setTimeout(function(){
  location.replace("https://apps.apple.com/app/apple-store/id6797506794?pt=129257514&ct=meta_direct_sep&mt=8");
},900);
</script>
